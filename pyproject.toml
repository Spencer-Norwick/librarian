[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reading-librarian"
version = "0.1.0"
description = "A local flat-file reading librarian CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Local User" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
librarian = "librarian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
