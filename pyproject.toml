[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reading-librarian"
version = "0.1.0"
description = "A local flat-file reading librarian CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Spencer Norwick" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Spencer-Norwick/librarian"
Repository = "https://github.com/Spencer-Norwick/librarian"
Issues = "https://github.com/Spencer-Norwick/librarian/issues"

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
librarian = "librarian.cli:main"
reading-librarian = "librarian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
